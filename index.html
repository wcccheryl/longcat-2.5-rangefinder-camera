function makeLCDTexture(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;

// ============ 4. 几何辅助函数 ============
const V2 = a => a.map(p => new THREE.Vector2(p[0], p[1]));
function lathe(pts, seg = 32){ return new THREE.LatheGeometry(V2(pts), seg); }
function box(w, h, d){ return new THREE.BoxGeometry(w, h, d); }
function cyl(rt, rb, h, seg = 28){ return new THREE.CylinderGeometry(rt, rb, h, seg); }
function zcyl(rt, rb, h, seg = 28){ const g = cyl(rt, rb, h, seg); g.rotateX(Math.PI / 2); return g; }
function zlathe(pts, seg = 32){ const g = lathe(pts, seg); g.rotateX(Math.PI / 2); return g; }
function torus(r, t, seg = 32, ts = 12){ return new THREE.TorusGeometry(r, t, ts, seg); }
function sph(r, ws = 24, hs = 16){ return new THREE.SphereGeometry(r, ws, hs); }

// 螺纹：螺旋凸棱 + 法兰头，一次车削成型（单 mesh）
function screwGeo(r = 1.8, len = 7, head = 2.0, pitch = 0.55, seg = 20){
  const pts = [[0, -len / 2], [r * 0.80, -len / 2]];
  const n = Math.max(2, Math.round(len / pitch));
  for (let i = 0; i < n; i++){
    const y0 = -len / 2 + (i + 0.45) * (len / n);
    const y1 = -len / 2 + (i + 1.00) * (len / n);
    pts.push([r, y0], [r * 0.72, y1]);
  }
  pts.push([r * 1.45, len / 2], [r * 1.45, len / 2 + head], [r * 0.95, len / 2 + head], [0, len / 2 + head]);
  return lathe(pts, seg);
}
// 滚花旋钮
function knurlGeo(r = 8, h = 4, ridges = 36, seg = 48){
  const pts = [[0, -h / 2], [r * 0.94, -h / 2]];
  for (let i = 0; i < ridges; i++){
    pts.push([r, -h / 2 + (i + 0.5) * h / ridges], [r * 0.94, -h / 2 + (i + 1) * h / ridges]);
  }
  pts.push([r * 0.94, h / 2], [0, h / 2]);
  return lathe(pts, seg);
}
// 齿轮
function gearGeo(r = 5, h = 2.5, teeth = 18){
  const s = new THREE.Shape(), inner = r * 0.78;
  for (let i = 0; i < teeth * 4; i++){
    const a = i / (teeth * 4) * Math.PI * 2;
    const rr = (i % 4 === 1 || i % 4 === 2) ? r : inner;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false });
  g.translate(0, 0, -h / 2);
  return g;
}
// 弹簧（螺旋管）
function springGeo(r = 2.5, len = 12, coils = 9, tube = 0.35){
  const pts = [];
  for (let i = 0; i <= coils * 12; i++){
    const t = i / (coils * 12), a = t * coils * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, -len / 2 + t * len, Math.sin(a) * r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), coils * 12, tube, 6, false);
}
// 导线
function wireGeo(pts, tube = 0.35){
  return new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2]))), 24, tube, 6, false);
}
// 环形垫圈
function ringGeo(rOut, rIn, h, seg = 44){
  return zlathe([[rIn, -h / 2], [rOut, -h / 2], [rOut, h / 2], [rIn, h / 2], [rIn, -h / 2]], seg);
}

// ============ 5. 零件注册表 ============
const PARTS = [], LAYERS = [];
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function P(name, layer, mat, geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0){
  const m = new THREE.Mesh(geo, mat instanceof THREE.Material ? mat : (MAT[mat] || MAT['钢']));
  m.name = name;
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true;
  const i = PARTS.length;
  m.userData = {
    layer, idx: i,
    matName: (typeof mat === 'string') ? mat : (mat === lcdMat ? 'LCD' : (mat === ledMat ? '红色LED' : '定制')),
    home: m.position.clone(), homeRot: new THREE.Euler(rx, ry, rz),
    tumble: new THREE.Euler((rnd(i) - .5) * 0.28, (rnd(i + 500) - .5) * 0.9, (rnd(i + 900) - .5) * 0.28),
    explode: new THREE.Vector3(), diagram: new THREE.Vector3(),
  };
  model.add(m); PARTS.push(m);
  if (!LAYERS.includes(layer)) LAYERS.push(layer);
  return m;
}

}

// ============ 7. 布局：飞出云(尺寸感知+松弛防穿插) / 平面结构图(货架排列) ============
const CENTER = new THREE.Vector3(0, 2, 0);
const LAYER_ORDER = ['镜头', '顶盖控制', '背面部件', '外壳', '取景光学', '机芯', '电子', '紧固件'];
const LAYER_ARC  = { '镜头': 8, '顶盖控制': 26, '背面部件': 10, '外壳': 20, '取景光学': 38, '机芯': 48, '电子': 48, '紧固件': 30 };
function layerIndex(l){ const i = LAYER_ORDER.indexOf(l); return i < 0 ? LAYER_ORDER.length : i; }

// 旋转后的轴对齐包围盒（保证按实际朝向计算占位）
const _rb = new THREE.Box3(), _rv = new THREE.Vector3();
function rotBBox(mesh){
  const bb = mesh.geometry.boundingBox;
  _rb.makeEmpty();
  for (let i = 0; i < 8; i++){
    _rv.set((i & 1) ? bb.max.x : bb.min.x, (i & 2) ? bb.max.y : bb.min.y, (i & 4) ? bb.max.z : bb.min.z);
    _rv.applyEuler(mesh.userData.homeRot);
    _rb.expandByPoint(_rv);
  }
  return _rb;
}

function computeLayout(){
  const byLayer = {};
  PARTS.forEach(p => {
    const L = p.userData.layer;
    (byLayer[L] = byLayer[L] || []).push(p);
    p.geometry.computeBoundingBox();
    p.geometry.computeBoundingSphere();
  });
  const vtmp = new THREE.Vector3();

  // ---- 阶段②：径向爆炸云。沿零件自身装配方向飞出，距离随尺寸/外扩程度递增 ----
  const items = [...PARTS];
  items.forEach((p, i) => {
    const u = p.userData, h = u.home, b = p.geometry.boundingSphere.radius;
    const jit = new THREE.Vector3(rnd(i * 3 + 1) - .5, rnd(i * 3 + 2) - .5, rnd(i * 3 + 3) - .5).multiplyScalar(0.5);
    const dir = h.clone().sub(CENTER);
    dir.add(jit);
    if (dir.lengthSq() < 1e-4) dir.set(rnd(i + 7) - .5, rnd(i + 11) - .5, rnd(i + 13) - .5);
    dir.normalize();
    const along = Math.max(0, h.clone().sub(CENTER).dot(dir));
    u.explode.copy(h).addScaledVector(dir, 20 + b * 0.38 + along * 0.1);
    u.explode.y += h.y * 0.5;
  });
  // 松弛：把互相穿插的零件成对推开
  const sorted = [...items].sort((a, b) => b.geometry.boundingSphere.radius - a.geometry.boundingSphere.radius);
  for (let iter = 0; iter < 30; iter++){
    for (let i = 0; i < sorted.length; i++){
      const A = sorted[i], va = A.userData.explode, ba = A.geometry.boundingSphere.radius;
      for (let j = i + 1; j < sorted.length; j++){
        const B = sorted[j], vb = B.userData.explode;
        const min = (ba + B.geometry.boundingSphere.radius) * 1.04;
        const d = va.distanceTo(vb);
        if (d < min && d > 1e-4){
          const push = (min - d) * 0.5;
          vtmp.copy(vb).sub(va).normalize();
          va.addScaledVector(vtmp, -push);
          vb.addScaledVector(vtmp, push);
        }
      }
    }
  }
  // 量化检查结果（显示在面板上，便于自查）
  let worst = 0;
  for (let i = 0; i < sorted.length; i++){
    const A = sorted[i], ba = A.geometry.boundingSphere.radius;
    for (let j = i + 1; j < sorted.length; j++){
      const B = sorted[j];
      const min = (ba + B.geometry.boundingSphere.radius) * 1.04;
      const d = A.userData.explode.distanceTo(B.userData.explode);
      if (d < min) worst = Math.max(worst, (min - d) / min);
    }
  }
  window.__explodeOverlap = +worst.toFixed(3);
  const eb = new THREE.Box3();
  for (const p of PARTS) eb.expandByPoint(p.userData.explode);
  window.__explodeBox = eb;

  // ---- 阶段③：平面结构图。按层分带，带内货架式排列，按旋转后真实占地面积布点 ----
  const GAP = 12, ROW_W = 620, PLANE_Y = -46, BAND_GAP = 26;
  const bands = LAYERS.map(L => {
    const arr = (byLayer[L] || []).map(p => {
      const bb = rotBBox(p);
      return { p, w: (bb.max.x - bb.min.x) + GAP, d: (bb.max.z - bb.min.z) + GAP,
               minY: bb.min.y, maxY: bb.max.y };
    }).sort((a, b) => b.d - a.d || b.w - a.w);
    let x = 0, z = 0, rowH = 0;
    const rows = [];
    let row = [];
    arr.forEach(it => {
      if (x + it.w > ROW_W && row.length){ rows.push({ z, h: rowH, row }); z += rowH; x = 0; rowH = 0; row = []; }
      it.cx = x + it.w / 2;
      x += it.w; rowH = Math.max(rowH, it.d);
      row.push(it);
    });
    if (row.length){ rows.push({ z, h: rowH, row }); z += rowH; }
    return { rows, depth: z };
  });
  const totalDepth = bands.reduce((s, b) => s + b.depth, 0) + BAND_GAP * (bands.length - 1);
  let zc = -totalDepth / 2;
  bands.forEach(band => {
    band.rows.forEach(r => {
      const rowW = r.row.reduce((s, it) => Math.max(s, it.cx + it.w / 2), 0);
      r.row.forEach(it => {
        it.p.userData.diagram.set(it.cx - rowW / 2, PLANE_Y - it.minY, zc + r.z + r.h / 2);
      });
    });
    zc += band.depth + BAND_GAP;
  });
}
computeLayout();

// ============ 8. 动画状态机 ============
const N = PARTS.length;
const DT2 = 0.10, DUR2 = 1.6;      // 拆解：零件间隔 / 单个时长
const DT4 = 0.08, DUR4 = 1.4;      // 合体：反向
const SPREAD3 = 4.2;               // 爆炸视图展开时长
const T_END2 = (N - 1) * DT2 + DUR2;
const T_END4 = (N - 1) * DT4 + DUR4;
const state = { stage: 1, stageTime: 0, totalTime: 0 };
const clamp01 = v => Math.min(1, Math.max(0, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = t => t * t * (3 - 2 * t);
const tmpV = new THREE.Vector3();

function updateParts(){
  const t = state.stageTime, st = state.stage;
  for (const p of PARTS){
    const u = p.userData;
    if (st === 1){ p.position.copy(u.home); p.rotation.copy(u.homeRot); continue; }
    if (st === 2){
      const e = easeOut(clamp01((t - u.idx * DT2) / DUR2));
      tmpV.lerpVectors(u.home, u.explode, e);
      tmpV.y += Math.sin(e * Math.PI) * (LAYER_ARC[u.layer] || 20) * 0.55;
      p.position.copy(tmpV);
      p.rotation.set(u.homeRot.x + u.tumble.x * e, u.homeRot.y + u.tumble.y * e, u.homeRot.z + u.tumble.z * e);
    } else if (st === 3){
      const e = smooth(clamp01(t / SPREAD3)), te = 1 - e;
      tmpV.lerpVectors(u.explode, u.diagram, e);
      p.position.copy(tmpV);
      p.rotation.set(u.homeRot.x + u.tumble.x * te, u.homeRot.y + u.tumble.y * te, u.homeRot.z + u.tumble.z * te);
    } else {
      const e = easeInOut(clamp01((t - (N - 1 - u.idx) * DT4) / DUR4));
      tmpV.lerpVectors(u.diagram, u.home, e);
      p.position.copy(tmpV);
      p.rotation.set(u.homeRot.x + u.tumble.x * (1 - e), u.homeRot.y + u.tumble.y * (1 - e), u.homeRot.z + u.tumble.z * (1 - e));
    }
  }
}

  const t = state.stageTime;
  if (state.stage === 1) return smooth(clamp01(t / 6));
  if (state.stage === 2) return smooth(clamp01(t / T_END2));
  if (state.stage === 3) return smooth(clamp01(t / SPREAD3));
  return smooth(clamp01(t / T_END4));
}
function updateCamera(){
  const K = CAM_KEYS[state.stage], pr = camProgress();
  cam.d = K.d[0] + (K.d[1] - K.d[0]) * pr;
  cam.h = K.h[0] + (K.h[1] - K.h[0]) * pr;
  cam.ly = K.ly[0] + (K.ly[1] - K.ly[0]) * pr;
  cam.fov = K.fov[0] + (K.fov[1] - K.fov[0]) * pr;
  const azBase = Q.has('az') ? (+Q.get('az') || 0) : state.totalTime * 0.05;
  const az = azBase + (state.stage === 2 ? state.stageTime * 0.03 : 0);
  const h = Q.has('h') ? (+Q.get('h')) : cam.h;
  const d = Q.has('d') ? (+Q.get('d')) : cam.d;
  const ly = Q.has('ly') ? (+Q.get('ly')) : cam.ly;
  camera.position.set(Math.cos(az) * d, h, Math.sin(az) * d);
  camera.lookAt(0, ly, 0);
  if (Math.abs(camera.fov - cam.fov) > 0.01){ camera.fov = cam.fov; camera.updateProjectionMatrix(); }
}
function updateSpin(dt){
  if (state.stage === 1){
    spin += (1 - spin) * (1 - Math.exp(-dt * 1.2));
    model.rotation.y += spin * dt * 0.16;
  } else if (state.stage === 3){
    // 结构图需要横平竖直：把累计自转缓动回 0
    model.rotation.y += (0 - model.rotation.y) * (1 - Math.exp(-dt * 2.2));
    spin = 0;
  } else {
    spin = 0;
  }
}

// ---- 开机效果 ----
let power = 0;
function updatePower(dt){
  const on = (state.stage === 1) || (state.stage === 4 && state.stageTime > T_END4);
  power += ((on ? 1 : 0) - power) * (1 - Math.exp(-dt * 2.2));
  ledMat.emissiveIntensity = power * 3.4;
  lcdMat.color.setScalar(0.04 + power * 0.96);
  backlightMat.emissiveIntensity = power * 1.6;
  innerLight.intensity = power * 14.0;
}

// ---- UI ----
const STAGE_NAMES = ['', '整机静止展示', '拆解 · 零件按装配顺序飞出', '爆炸视图 · 结构图', '合体 · 开机'];
const elName = document.getElementById('stageName');
const elInfo = document.getElementById('partInfo');
const elBar = document.getElementById('barFill');
function updateUI(){
  elName.textContent = '阶段 ' + state.stage + '/4 · ' + STAGE_NAMES[state.stage];
  elInfo.textContent = '零件 ' + N + ' · 层 ' + LAYERS.length + ' · 云团穿插 ' + (window.__explodeOverlap || 0);
  let pr = 0;
  if (state.stage === 2) pr = clamp01(state.stageTime / T_END2);
  else if (state.stage === 3) pr = clamp01(state.stageTime / SPREAD3);
  else if (state.stage === 4) pr = clamp01(state.stageTime / (T_END4 + 2));
  elBar.style.width = (pr * 100).toFixed(1) + '%';
}
function setStage(n){
  state.stage = n; state.stageTime = 0;
  const K = CAM_KEYS[n];
  cam.d = K.d[0]; cam.h = K.h[0]; cam.ly = K.ly[0]; cam.fov = K.fov[0];
  updateUI();
}
document.getElementById('stageBtn').addEventListener('click', () => setStage(state.stage % 4 + 1));
window.addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '4') setStage(+e.key); });

function updateFloor(){
  const pr = camProgress();
  let y = -50, op = 1;
  if (state.stage === 2){ y = -50 - 560 * pr; op = 1 - clamp01(pr * 1.5); }
  else if (state.stage === 3){ y = -610 + 560 * pr; op = pr; }
  ground.position.y = y;
  ground.material.opacity = op;
}
function step(dt, ui = true){
  state.totalTime += dt; state.stageTime += dt;
  updateSpin(dt); updateParts(); updatePower(dt); updateCamera(); updateFloor();
  if (ui) updateUI();
}
function seekTo(t){
  const h = 1 / 60;
  for (let x = 0; x < t; x += h) step(Math.min(h, t - x), false);
  updateUI();
}

// ============ 9. 启动：正常循环 / 冻结截图 / CSV 导出 ============
if (Q.has('csv')){
  document.body.textContent =
    'name,layer,material\n' + PARTS.map(p => p.name + ',' + p.userData.layer + ',' + p.userData.matName).join('\n');
  window.__ready = true;
} else if (Q.has('freeze')){
  setStage(+(Q.get('stage')) || 1);
  seekTo(+(Q.get('t')) || 0);
  updateCamera();
  renderer.render(scene, camera);
  window.__frozen = true;
} else {
  const clock = new THREE.Clock();
  (function loop(){
    requestAnimationFrame(loop);
    step(Math.min(clock.getDelta(), 0.05));
    renderer.render(scene, camera);
  })();
}
window.__ready = true;
</script>
</body>
</html>
